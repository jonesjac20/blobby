# Phase 10 CD. Called from ci.yml after build on main. Runs on the
# production host's self-hosted runner — not GitHub-hosted, not the home VM.
# GitHub `needs:` cannot cross workflow files, so this is `workflow_call`
# and ci.yml's deploy job is the `needs: build` gate.
#
# `blobby-prod` is required so a leftover home-VM or laptop runner cannot
# take this job. Add that label when registering (Phase 10 Human).
name: Deploy

on:
  workflow_call:

jobs:
  deploy:
    runs-on: [self-hosted, linux, blobby-prod]
    env:
      BLOBBY_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull and run
        run: |
          docker compose pull
          docker compose up -d --force-recreate
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "healthz did not return 200" >&2
          exit 1
