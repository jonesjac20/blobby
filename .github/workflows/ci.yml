# Phase 8 CI. Runs on GitHub-hosted Ubuntu, not the VirtualBox game VM.
# A red check here is the gate; nothing on the VM changes.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest
      - name: Lint
        run: ruff check .
