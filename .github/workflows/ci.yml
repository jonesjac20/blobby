# Phase 8 CI + Phase 9 package. Runs on GitHub-hosted Ubuntu, not the
# VirtualBox game VM. A red check here is the gate; nothing on the VM changes.
name: CI

on:
  push:
  pull_request:

# One build+deploy on main at a time. Two parallel `latest` pushes can
# otherwise let the slower (older) SHA win and roll production back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest
      - name: Lint
        run: ruff check .

  # Only on push to main, and only after test is green. A PR must not
  # publish `latest`. packages:write is required; default GITHUB_TOKEN
  # cannot push to GHCR without it.
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE="${IMAGE,,}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Self-hosted on the production EC2 once Phase 11 has registered a runner.
  # Skipped on PRs: `build` is skipped off main, and a skipped `needs` skips this.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
